<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Pack — Custom Gift Box &amp; Paper Packaging Manufacturer</title>
<meta name="description" content="Custom gift box manufacturer: rigid boxes, book boxes, drawer boxes, folding cartons, corrugated cases and paper bags. Design, proofing, printing, die-cutting, wrapping and assembly in one factory.">
<meta property="og:type" content="website">
<meta property="og:title" content="Meridian Pack — Custom Gift Box Manufacturer">
<meta property="og:description" content="One factory for packaging design, proofing, printing, die-cutting, wrapping and assembly. Rigid gift boxes, folding cartons, mailers and paper bags.">
<meta name="theme-color" content="#08152B">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- ============ HEADER ============ -->
<header class="hdr" id="hdr">
  <div class="wrap hdr-in">
    <a class="brand" href="#top" aria-label="Home">
      <span class="brand-mark" data-edit="brandMark">M</span>
      <span class="brand-txt">
        <b data-edit="brand">Meridian Pack</b>
        <i data-edit="brandSub">Paper Packaging Manufacturer</i>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="Main"></nav>

    <div class="hdr-act">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="on">EN</button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button type="button" data-lang="zh">中文</button>
      </div>
      <a class="btn btn-sm" href="#contact" data-edit="cta.quote">Request a quote</a>
      <button class="burger" type="button" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="nav">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <!-- ============ HERO ============ -->
  <section class="hero" id="top">
    <div class="hero-media">
      <img data-img="hero.image" data-img-alt="hero.alt" alt="" fetchpriority="high">
    </div>
    <div class="wrap hero-in">
      <p class="eyebrow eyebrow-light" data-edit="hero.eyebrow"></p>
      <h1 class="hero-title">
        <span data-edit="hero.title"></span>
        <em data-edit="hero.titleEm"></em>
      </h1>
      <p class="hero-sub" data-edit="hero.sub"></p>
      <div class="hero-cta">
        <a class="btn" href="#contact"><span data-edit="cta.quote"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a>
        <a class="btn btn-ghost" href="#products"><span data-edit="cta.view"></span></a>
      </div>
    </div>
    <div class="wrap hero-foot">
      <ul class="trust" id="trust"></ul>
    </div>
  </section>

  <!-- ============ CAPABILITY ============ -->
  <section class="sec" id="capability">
    <div class="wrap">
      <header class="sec-head">
        <p class="eyebrow"><span class="idx">01</span><span data-edit="capSec.eyebrow"></span></p>
        <h2 class="h2" data-edit="capSec.title"></h2>
        <p class="lead" data-edit="capSec.lead"></p>
      </header>
      <ol class="caps" id="caps"></ol>
    </div>
  </section>

  <!-- ============ PRODUCTS ============ -->
  <section class="sec sec-bone" id="products">
    <div class="wrap">
      <header class="sec-head">
        <p class="eyebrow"><span class="idx">02</span><span data-edit="prodSec.eyebrow"></span></p>
        <h2 class="h2" data-edit="prodSec.title"></h2>
        <p class="lead" data-edit="prodSec.lead"></p>
      </header>
      <div class="prod-grid" id="prodGrid"></div>
    </div>
  </section>

  <!-- ============ FINISHING ============ -->
  <section class="sec dark fin" id="finishing">
    <div class="wrap fin-in">
      <div class="fin-media">
        <img data-img="finSec.image" data-img-alt="finSec.imgAlt" alt="" loading="lazy">
      </div>
      <div class="fin-body">
        <p class="eyebrow eyebrow-light"><span class="idx">03</span><span data-edit="finSec.eyebrow"></span></p>
        <h2 class="h2" data-edit="finSec.title"></h2>
        <p class="lead" data-edit="finSec.lead"></p>
        <dl class="fin-list" id="finList"></dl>
        <p class="fin-note" data-edit="finSec.note"></p>
      </div>
    </div>
  </section>

  <!-- ============ FACTORY ============ -->
  <section class="sec" id="factory">
    <div class="wrap">
      <div class="fac-grid">
        <div class="fac-txt">
          <p class="eyebrow"><span class="idx">04</span><span data-edit="facSec.eyebrow"></span></p>
          <h2 class="h2" data-edit="facSec.title"></h2>
          <p class="body" data-edit="facSec.body1"></p>
          <p class="body" data-edit="facSec.body2"></p>
          <ul class="ticks" id="facPoints"></ul>
        </div>
        <figure class="fac-media">
          <img data-img="facSec.image" data-img-alt="facSec.imgAlt" alt="" loading="lazy">
        </figure>
      </div>
      <div class="nums" id="nums"></div>
    </div>
  </section>

  <!-- ============ FLOW ============ -->
  <section class="sec sec-bone flow">
    <div class="wrap">
      <header class="sec-head">
        <p class="eyebrow"><span class="idx">05</span><span data-edit="flowSec.eyebrow"></span></p>
        <h2 class="h2" data-edit="flowSec.title"></h2>
      </header>
      <ol class="flow-list" id="flow"></ol>
    </div>
  </section>

  <!-- ============ INDUSTRIES ============ -->
  <section class="sec" id="industries">
    <div class="wrap">
      <header class="sec-head">
        <p class="eyebrow"><span class="idx">06</span><span data-edit="indSec.eyebrow"></span></p>
        <h2 class="h2" data-edit="indSec.title"></h2>
        <p class="lead" data-edit="indSec.lead"></p>
      </header>
      <div class="ind-grid" id="indGrid"></div>
    </div>
  </section>

  <!-- ============ CONTACT ============ -->
  <section class="sec dark contact" id="contact">
    <div class="wrap">
      <div class="ct-grid">
        <div class="ct-txt">
          <p class="eyebrow eyebrow-light"><span class="idx">07</span><span data-edit="contact.eyebrow"></span></p>
          <h2 class="h2" data-edit="contact.title"></h2>
          <p class="lead" data-edit="contact.lead"></p>
          <div class="ct-info">
            <p class="ct-label" data-edit="contact.infoTitle"></p>
            <dl id="ctRows"></dl>
          </div>
        </div>

        <form class="form" id="form" novalidate>
          <div class="form-row">
            <label><span data-edit="contact.labels.name"></span><input name="name" type="text" autocomplete="name" required></label>
            <label><span data-edit="contact.labels.company"></span><input name="company" type="text" autocomplete="organization"></label>
          </div>
          <div class="form-row">
            <label><span data-edit="contact.labels.email"></span><input name="email" type="email" autocomplete="email" required></label>
            <label><span data-edit="contact.labels.country"></span><input name="country" type="text" autocomplete="country-name"></label>
          </div>
          <label class="full"><span data-edit="contact.labels.interest"></span>
            <select name="interest" id="interestSel"></select>
          </label>
          <label class="full"><span data-edit="contact.labels.message"></span>
            <textarea name="message" rows="4"></textarea>
          </label>
          <button class="btn btn-gold" type="submit"><span data-edit="cta.send"></span>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <p class="form-note" data-edit="contact.note"></p>
        </form>
      </div>
    </div>
  </section>

</main>

<!-- ============ FOOTER ============ -->
<footer class="ftr">
  <div class="wrap ftr-in">
    <div class="ftr-brand">
      <span class="brand-mark" data-edit="brandMark">M</span>
      <span class="brand-txt"><b data-edit="brand"></b><i data-edit="brandSub"></i></span>
    </div>
    <nav class="ftr-nav" id="ftrNav" aria-label="Footer"></nav>
    <div class="ftr-meta">
      <p data-edit="footer.note"></p>
      <p data-edit="footer.rights"></p>
    </div>
  </div>
</footer>

<!-- ============ EDITOR ============ -->
<button class="edit-toggle" id="editToggle" type="button" aria-label="Edit content" title="Edit content">
  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 3.5l3 3L8 15H5v-3l8.5-8.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
</button>

<div class="editbar" id="editBar" hidden>
  <div class="editbar-in">
    <span class="editbar-flag" id="editFlag">Editing · English</span>
    <span class="editbar-hint" id="editHint"></span>
    <div class="editbar-btns">
      <button type="button" class="eb" id="ebExport">Export content.js</button>
      <button type="button" class="eb" id="ebReset">Reset</button>
      <button type="button" class="eb eb-done" id="ebDone">Done</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="assets/js/content.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
